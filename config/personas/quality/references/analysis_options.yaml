# Quality gates for Dart/Flutter — merge into the project's
# analysis_options.yaml. dart analyze runs per edit, at turn end and in CI.
# (Use package:flutter_lints/flutter.yaml instead of lints for Flutter apps.)
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Promote the lints that matter to errors so the gates fail on them.
    missing_return: error
    unused_import: error
    avoid_dynamic_calls: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - prefer_final_in_for_each
    - unawaited_futures
    - use_super_parameters
