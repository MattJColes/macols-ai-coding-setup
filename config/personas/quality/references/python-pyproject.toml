# Quality gates for Python — merge these tables into the project's
# pyproject.toml (don't replace existing settings; tighten them).
# The turn-end hook and CI run: ruff check, pyright, lint-imports, pytest.
# With pytest-testmon in the dev dependencies the turn-end hook selects tests
# by coverage (--testmon); gitignore .testmondata*.

[tool.ruff.lint]
# E/F/W/I: the usual; C90: complexity; PLR09xx: size limits; S: bandit
# security rules (cheap local SAST); B: bugbear; UP: modern syntax.
extend-select = ["E", "F", "W", "I", "B", "UP", "S", "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Tests may assert and take many fixtures.
"tests/**" = ["S101", "PLR0913", "PLR0915"]

[tool.pyright]
typeCheckingMode = "strict"
# Point pyright at the project venv so third-party types resolve.
venvPath = "."
venv = ".venv"

# Layer rules (import-linter). Contract names are shown to the agent when a
# contract breaks, so write them as the fix instruction.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Features are independent. Fix: move shared code into app.core, or call the other feature through an event/interface it exposes. See docs/architecture.md#features"
type = "independence"
modules = ["app.orders", "app.billing"]

[[tool.importlinter.contracts]]
name = "Layers only call downwards (routers -> services -> repositories -> models). Fix: move the call down a layer, or pass a callback/Protocol in from above. See docs/architecture.md#layers"
type = "layers"
containers = ["app.orders", "app.billing"]
layers = ["routers", "services", "repositories", "models"]
# Approved exceptions: one line each, with why and when it goes.
# ignore_imports = ["app.orders.routers.admin -> app.orders.repositories.audit"]  # legacy admin page, remove with ORD-123
