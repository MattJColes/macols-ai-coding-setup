# .macols/checks.conf - project commands for each feedback loop. The agent
# hooks read these as data (never sourced) and run them from the repo root,
# in trusted projects only (bin/macols-trust). Delete the lines you don't need.

# Every agent turn: fast checks on touched code, e.g. schema validation.
IMMEDIATE="uv run python scripts/validate_schemas.py"

# Before each commit: affected integration tests and a small eval smoke set.
CHECKPOINT="uv run pytest -m integration -q && uv run python -m evals.smoke"

# Tests the checkpoint runs: related (default) runs only the tests the commit's
# changes reach, leaving the full suite to CI; full runs each affected
# package's whole suite. Use full only when the suite takes seconds.
# CHECKPOINT_TESTS=full

# Nightly CI (quality.yml schedule): E2E, broad model matrix, load tests, the
# full eval suite.
NIGHTLY="npx playwright test && uv run python -m evals.full"
