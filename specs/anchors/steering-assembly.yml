# Spec anchors — steering-assembly capability
# (openspec/specs/steering-assembly/spec.md)

steering-assembly.assemble:
  language: bash
  rule:
    kind: function_definition
    has: { field: name, regex: '^assemble_steering$' }
  files: [lib/common.sh]

steering-assembly.ponytail-append:
  language: bash
  rule:
    kind: function_definition
    has: { field: name, regex: '^append_ponytail_ruleset$' }
  files: [lib/common.sh]
