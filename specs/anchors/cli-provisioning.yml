# Spec anchors — cli-provisioning capability
# (openspec/specs/cli-provisioning/spec.md)

cli-provisioning.cli:
  language: bash
  rule:
    kind: function_definition
    has: { field: name, regex: '^ensure_cli$' }
  files: [lib/os.sh]

cli-provisioning.openspec:
  language: bash
  rule:
    kind: function_definition
    has: { field: name, regex: '^ensure_openspec$' }
  files: [lib/os.sh]

