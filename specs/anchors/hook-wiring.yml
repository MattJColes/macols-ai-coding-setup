# Spec anchors — hook-wiring capability
# (openspec/specs/hook-wiring/spec.md)

hook-wiring.claude:
  language: bash
  rule:
    kind: function_definition
    has: { field: name, regex: '^write_claude_hooks$' }
  files: [lib/hooks.sh]

hook-wiring.codex:
  language: bash
  rule:
    kind: function_definition
    has: { field: name, regex: '^write_codex_hooks$' }
  files: [lib/hooks.sh]

hook-wiring.zcode:
  language: bash
  rule:
    kind: function_definition
    has: { field: name, regex: '^write_zcode_hooks$' }
  files: [lib/hooks.sh]

hook-wiring.opencode-plugin:
  language: bash
  rule:
    kind: function_definition
    has: { field: name, regex: '^install_opencode_plugin$' }
  files: [lib/hooks.sh]

hook-wiring.pi-extension:
  language: bash
  rule:
    kind: function_definition
    has: { field: name, regex: '^install_pi_extension$' }
  files: [lib/hooks.sh]

hook-wiring.turn-end-gate:
  language: bash
  rule:
    kind: function_definition
    has: { field: name, regex: '^changes_since_last_check$' }
  files: [hooks/checks/common.sh]
